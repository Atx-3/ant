<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Estimator</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js CDN (Chart banane ke liye) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Default font set karna */
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Slider thumb ko style karne ke liye */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #007BFF;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            margin-top: -8px; /* Thumb ko track ke center mein laane ke liye */
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #007BFF;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
    </style>
    
    <script>
        // Tailwind config ko custom colors add karne ke liye
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#007BFF',
                        'brand-blue-dark': '#0056b3',
                        'brand-purple': '#6f42c1',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <nav class="container mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-brand-purple flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 8h6m-5 0a3 3 0 110 6H9l-1 1H6a1 1 0 01-1-1V7a1 1 0 011-1h3l1 1zM15 8a3 3 0 110 6h-3l1 1h3a1 1 0 001-1V7a1 1 0 00-1-1h-3l-1 1z" />
                </svg>
                Budget Estimator for Raj Prints
            </h1>
            <button class="text-brand-blue font-medium flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.368a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z" />
                </svg>
                Share
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto max-w-7xl p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            
            <!-- Left Column: Inputs -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Card 1: City & Vertical -->
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <div class="mb-4">
                        <label class="text-sm font-medium text-gray-700">Please Select City</label>
                        <input id="city-input" type="text" placeholder="Jaise: 'Lucknow'" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-brand-blue focus:border-brand-blue">
                    </div>
                    <div>
                        <label class="text-sm font-medium text-gray-700">Preferred Vertical</label>
                        <select id="vertical-select" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-brand-blue focus:border-brand-blue bg-white">
                            <option value="1">All Verticals</option>
                            <option value="1.5">Finance & Real Estate</option>
                            <option value="1.2">FMCG & Retail</option>
                            <option value="1.1">Education</option>
                            <option value="0.9">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Card 2: Brand Details -->
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-6">Tell us more about Raj Prints</h3>
                    
                    <!-- Brand Stage Slider -->
                    <div class="mb-8">
                        <label for="brand-stage-slider" class="block text-sm font-medium text-gray-700 mb-2">Brand Stage</label>
                        <input id="brand-stage-slider" type="range" min="10" max="100" value="30" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500 mt-2">
                            <span>New</span>
                            <span>Established</span>
                        </div>
                    </div>
                    
                    <!-- Campaign Objective Slider -->
                    <div class="mb-8">
                        <label for="objective-slider" class="block text-sm font-medium text-gray-700 mb-2">Campaign Objective</label>
                        <input id="objective-slider" type="range" min="10" max="100" value="40" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500 mt-2">
                            <span>Pilot</span>
                            <span>Sales</span>
                        </div>
                    </div>

                    <!-- Reach Slider -->
                    <div>
                        <label for="reach-slider" class="block text-sm font-medium text-gray-700 mb-2">Reach</label>
                        <input id="reach-slider" type="range" min="10" max="100" value="20" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500 mt-2">
                            <span>Hyperlocal</span>
                            <span>Pan India</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Outputs -->
            <div class="lg:col-span-3 space-y-6">
                <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
                    <!-- Suggested Budget -->
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <span class="text-sm font-medium text-gray-600">Suggested Budget:</span>
                            <h2 id="suggested-budget-text" class="text-4xl font-extrabold text-brand-purple">₹0</h2>
                        </div>
                        <button class="text-gray-500 hover:text-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>

                    <!-- Bar Chart -->
                    <div>
                        <canvas id="budgetChart"></canvas>
                    </div>

                    <!-- Tabs -->
                    <div class="mt-6">
                        <h4 class="text-sm font-medium text-gray-600 mb-2">Suggested Budgets</h4>
                        <div class="flex space-x-2">
                            <button class="flex-1 py-2 px-4 rounded-lg bg-blue-100 text-blue-700 font-medium text-sm">Pilot</button>
                            <button class="flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 font-medium text-sm">Cruise</button>
                            <button class="flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 font-medium text-sm">Accelerate</button>
                        </div>
                    </div>

                    <!-- Suggestion Box -->
                    <div class="mt-6 bg-yellow-100 border-l-4 border-yellow-400 text-yellow-800 p-4 rounded-r-lg">
                        <p id="suggestion-text" class="text-sm">We suggest you to run a campaign for...</p>
                    </div>

                    <!-- Get Plan Button -->
                    <div class="mt-6">
                        <button class="w-full py-3 px-6 bg-brand-blue text-white font-bold rounded-lg shadow-md hover:bg-brand-blue-dark transition-colors">
                            Get Plan for Raj Prints
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Global variables ---
        let myBudgetChart;
        const brandStageSlider = document.getElementById('brand-stage-slider');
        const objectiveSlider = document.getElementById('objective-slider');
        const reachSlider = document.getElementById('reach-slider');
        const verticalSelect = document.getElementById('vertical-select');
        const suggestedBudgetText = document.getElementById('suggested-budget-text');
        const suggestionText = document.getElementById('suggestion-text');

        // --- Budget Calculation Logic ---
        function calculateBudget() {
            // 1. Saare inputs se values lena
            const brandStage = parseInt(brandStageSlider.value); // 10-100
            const objective = parseInt(objectiveSlider.value); // 10-100
            const reach = parseInt(reachSlider.value); // 10-100
            const verticalMultiplier = parseFloat(verticalSelect.value); // 1-1.5

            // 2. Base budget aur multipliers set karna (yeh sample logic hai)
            const baseBudget = 50000;
            
            // Brand Stage Multiplier (New=1, Established=1.9)
            const stageMultiplier = 1 + (brandStage - 10) / 100 * 0.9;
            // Objective Multiplier (Pilot=1, Sales=2)
            const objectiveMultiplier = 1 + (objective - 10) / 90;
            // Reach Multiplier (Hyperlocal=1, Pan India=10)
            const reachMultiplier = 1 + (reach - 10) / 90 * 9;

            // 3. Alag-alag plans ke budget calculate karna
            const pilotBudget = baseBudget * verticalMultiplier * stageMultiplier * objectiveMultiplier * reachMultiplier;
            const cruiseBudget = pilotBudget * 1.8;
            const accelerateBudget = pilotBudget * 3.2;

            // 4. Kaunsa budget recommend karna hai, yeh decide karna
            // Hum objective ke basis par decide karenge
            let recommendedBudget = pilotBudget;
            let recommendedPlan = 'Pilot';
            
            if (objective > 70) {
                recommendedBudget = accelerateBudget;
                recommendedPlan = 'Accelerate';
            } else if (objective > 35) {
                recommendedBudget = cruiseBudget;
                recommendedPlan = 'Cruise';
            }

            // 5. UI (Homepage) ko update karna
            
            // Format karne ke liye (Taaki '13,50,000' jaisa dikhe)
            const formatCurrency = (amount) => {
                return '₹' + amount.toLocaleString('en-IN', { maximumFractionDigits: 0 });
            }
            
            // Suggested Budget Text update karna
            suggestedBudgetText.innerText = formatCurrency(recommendedBudget);
            
            // Suggestion box update karna
            suggestionText.innerText = `We suggest you to run a ${recommendedPlan} campaign for ${formatCurrency(recommendedBudget)} and unlock maximum impact for Raj Prints!`;

            // 6. Chart ko update karna
            if (myBudgetChart) {
                myBudgetChart.data.datasets[0].data = [pilotBudget, cruiseBudget, accelerateBudget];
                myBudgetChart.update();
            }
        }

        // --- Chart Initialization Logic ---
        function initChart() {
            const ctx = document.getElementById('budgetChart').getContext('2d');
            myBudgetChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pilot', 'Cruise', 'Accelerate'],
                    datasets: [{
                        label: 'Spending in ₹',
                        data: [0, 0, 0], // Shuru mein 0, fir calculateBudget se update hoga
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.6)', // Blue
                            'rgba(75, 192, 192, 0.6)', // Green
                            'rgba(111, 66, 193, 0.6)'  // Purple (brand-purple)
                        ],
                        borderColor: [
                            'rgba(54, 162, 235, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(111, 66, 193, 1)'
                        ],
                        borderWidth: 1,
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                // Y-axis par '₹1.6M' jaisa format dikhane ke liye
                                callback: function(value, index, values) {
                                    if (value >= 10000000) {
                                        return '₹' + (value / 10000000) + 'Cr';
                                    } else if (value >= 100000) {
                                        return '₹' + (value / 100000) + 'L';
                                    } else if (value >= 1000) {
                                        return '₹' + (value / 1000) + 'K';
                                    }
                                    return '₹' + value;
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false // 'Spending in ₹' wala label hatane ke liye
                        },
                        tooltip: {
                            callbacks: {
                                // Tooltip mein '₹1,50,000' jaisa format dikhane ke liye
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y.toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- Event Listeners Set Up ---
        // Jab page load ho, tab chart banao aur budget calculate karo
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            calculateBudget();
            
            // Har slider ya select par 'input' event listener lagao
            brandStageSlider.addEventListener('input', calculateBudget);
            objectiveSlider.addEventListener('input', calculateBudget);
            reachSlider.addEventListener('input', calculateBudget);
            verticalSelect.addEventListener('input', calculateBudget);
        });

    </script>
</body>
</html>
